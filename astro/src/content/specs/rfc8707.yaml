id: "rfc8707"
title: "RFC 8707"
url: "https://www.rfc-editor.org/rfc/rfc8707"
status: "RFC"
# errata list checked by hand 2026-10-22 (rfc-editor.org/errata/rfc8707): only 6810 Verified, editorial (typo in §4). None on §2.
sections:
  - key: "resourceParam"
    section: "2"
    anchor: "section-2"
    title: "Resource Parameter"
    quote: "Multiple \"resource\" parameters MAY be used to indicate that the requested token is intended to be used at multiple resources."
  - key: "resourceAuth"
    section: "2.1"
    anchor: "section-2.1"
    title: "Resource in an Authorization Request"
  - key: "resourceSec"
    section: "3"
    anchor: "section-3"
    title: "Security Considerations"
    quote: "If a bearer token has multiple intended recipients (audiences), then the token is valid at more than one protected resource and can be used by any one of those resources to access any of the others."
