id: "rfc7636"
title: "RFC 7636"
url: "https://www.rfc-editor.org/rfc/rfc7636"
status: "RFC"
sections:
  - key: "pkceVer"
    section: "4.1"
    anchor: "section-4.1"
    title: "Client Creates a Code Verifier"
    quote: "code_verifier = high-entropy cryptographic random STRING using the unreserved characters [A-Z] / [a-z] / [0-9] / \"-\" / \".\" / \"_\" / \"~\" from Section 2.3 of [RFC3986], with a minimum length of 43 characters and a maximum length of 128 characters."
  - key: "pkceChal"
    section: "4.2"
    anchor: "section-4.2"
    title: "Client Creates the Code Challenge"
    quote: "If the client is capable of using \"S256\", it MUST use \"S256\", as \"S256\" is Mandatory To Implement (MTI) on the server."
  - key: "pkceSend"
    section: "4.5"
    anchor: "section-4.5"
    title: "Client Sends the Authorization Code and the Code Verifier to the Token Endpoint"
  - key: "pkceCheck"
    section: "4.6"
    anchor: "section-4.6"
    title: "Server Verifies code_verifier before Returning the Tokens"
    quote: "If the values are not equal, an error response indicating \"invalid_grant\" as described in Section 5.2 of [RFC6749] MUST be returned."
  - key: "pkceReq"
    section: "4.3"
    anchor: "section-4.3"
    title: "Client Sends the Code Challenge with the Authorization Request"
  - key: "pkceSrv"
    section: "4.4"
    anchor: "section-4.4"
    title: "Server Returns the Code"
