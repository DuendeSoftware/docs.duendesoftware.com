status: "RFC"
# errata list checked by hand 2026-10-22 (rfc-editor.org/errata/rfc9068): only 8802 Rejected (2026-10-12, §2.2 iss REQUIRED vs OPTIONAL: stays REQUIRED). None on §2.1, §4, §5.
sections:
  - key: "atJwt"
    section: "2"
    anchor: "section-2"
    title: "JWT Access Token Header and Data Structure"
  - key: "atTyp"
    section: "4"
    anchor: "section-4"
    title: "Validating JWT Access Tokens"
    quote: "The resource server MUST verify that the \"typ\" header value is \"at+jwt\" or \"application/at+jwt\" and reject tokens carrying any other value."
  - key: "atAud"
    section: "4"
    anchor: "section-4"
    title: "Validating JWT Access Tokens"
    quote: "The resource server MUST validate that the \"aud\" claim contains a resource indicator value corresponding to an identifier the resource server expects for itself."
