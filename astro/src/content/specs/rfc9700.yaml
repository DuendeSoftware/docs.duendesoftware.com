id: "rfc9700"
title: "RFC 9700"
url: "https://www.rfc-editor.org/rfc/rfc9700"
status: "RFC"
# token-types: errata list checked by hand 2026-10-22 (rfc-editor.org/errata/rfc9700): none.
sections:
  - key: "bcpRedir"
    section: "2.1"
    anchor: "section-2.1"
    title: "Security BCP: Protecting Redirect-Based Flows"
    quote: "When comparing client redirection URIs against pre-registered URIs, authorization servers MUST utilize exact string matching except for port numbers in localhost redirection URIs of native apps"
  - key: "bcpPkce"
    section: "2.1.1"
    anchor: "section-2.1.1"
    title: "Security BCP: Authorization Code Grant"
    quote: "Public clients MUST use PKCE [RFC7636]"
  - key: "bcpImplicit"
    section: "2.1.2"
    anchor: "section-2.1.2"
    title: "Security BCP: Implicit Grant"
    quote: "clients SHOULD NOT use the implicit grant (response type token) or other response types issuing access tokens in the authorization response"
  - key: "bcpRt"
    section: "2.2.2"
    anchor: "section-2.2.2"
    title: "Security BCP: Refresh Tokens"
    quote: "Refresh tokens for public clients MUST be sender-constrained or use refresh token rotation as described in Section 4.14."
  - key: "bcpAud"
    section: "2.3"
    anchor: "section-2.3"
    title: "Security BCP: Access Token Privilege Restriction"
    quote: "access tokens SHOULD be audience-restricted to a specific resource server or, if that is not feasible, to a small set of resource servers."
  - key: "bcpRopc"
    section: "2.4"
    anchor: "section-2.4"
    title: "Security BCP: Resource Owner Password Credentials Grant"
    quote: "The resource owner password credentials grant [RFC6749] MUST NOT be used. This grant type insecurely exposes the credentials of the resource owner to the client. Even if the client is benign, usage of this grant results in an increased attack surface (i.e., credentials can leak in more places than just the authorization server) and in training users to enter their credentials in places other than the authorization server."
  - key: "rfc9700_4_14"
    section: "4.14"
    anchor: "section-4.14"
    title: "Refresh Token Protection"
  # port-modules.mjs
  - key: "rfc9700_4_14_2"
    section: "4.14.2"
    anchor: "section-4.14.2"
    title: "Refresh Token Protection: Recommendations"
  - key: "pkceInject"
    section: "4.5"
    anchor: "section-4.5"
    title: "Authorization Code Injection"
