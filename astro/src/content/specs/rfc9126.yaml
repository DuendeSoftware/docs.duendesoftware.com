id: "rfc9126"
title: "RFC 9126"
url: "https://www.rfc-editor.org/rfc/rfc9126"
status: "RFC"
sections:
  - key: "parIntro"
    section: "1"
    anchor: "section-1"
    title: "Introduction"
  - key: "parEndpoint"
    section: "2"
    anchor: "section-2"
    title: "Pushed Authorization Request Endpoint"
    quote: "The rules for client authentication as defined in [RFC6749] for token endpoint requests, including the applicable authentication methods, apply for the PAR endpoint as well."
  - key: "parResponse"
    section: "2.2"
    anchor: "section-2.2"
    title: "Successful PAR Response"
    quote: "This URI is a single-use reference to the respective request data in the subsequent authorization request."
  - key: "parError"
    section: "2.3"
    anchor: "section-2.3"
    title: "Error Response"
  - key: "parRedirect"
    section: "2.4"
    anchor: "section-2.4"
    title: "Management of Client Redirect URIs"
  - key: "parJar"
    section: "3"
    anchor: "section-3"
    title: "The \"request\" Request Parameter"
  - key: "parRequest"
    section: "4"
    anchor: "section-4"
    title: "Authorization Request"
    quote: "An expired \"request_uri\" MUST be rejected as invalid."
  - key: "parSecGuess"
    section: "7.1"
    anchor: "section-7.1"
    title: "Request URI Guessing"
  - key: "parSecRedirect"
    section: "7.2"
    anchor: "section-7.2"
    title: "Open Redirection"
  - key: "parSecurity"
    section: "7.3"
    anchor: "section-7.3"
    title: "Request Object Replay"
    quote: "In order to cope with such attacks, the authorization server SHOULD make the request URIs one-time use."
  - key: "parSecPolicy"
    section: "7.4"
    anchor: "section-7.4"
    title: "Client Policy Change"
  - key: "parSecSwap"
    section: "7.5"
    anchor: "section-7.5"
    title: "Request URI Swapping"
