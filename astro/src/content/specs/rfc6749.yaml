id: "rfc6749"
title: "RFC 6749"
url: "https://www.rfc-editor.org/rfc/rfc6749"
status: "RFC"
# scopes: re-checked by hand 2026-10-22 (rfc-editor.org/errata/rfc6749). §3.3: 6613 Verified, editorial (wording "space-delimited list of case-sensitive strings"; no change in meaning). §5.1: 5379 and 6614 Reported, editorial; 4679 Reported, technical (Content-Type charset, not about scope; RFC 6749 §5.1 example kept as shown). §4.1: 5332 Reported (step B wording; consistent with §4.1.1). Nothing changes a scope claim.
# client-credentials: re-checked by hand 2026-10-22 (rfc-editor.org/errata/rfc6749). §4.4: none. §2.3.1: 4749, 5793, 6017 Reported (Basic wording, "Alternatively", RFC 7617). §3.2.1: 7631, 7823 Reported. §5.1: 4679 Reported (charset), 6614 Reported editorial. §5.2: 4745 Reported (invalid_client 401 paragraph). None Verified; no claim changes.
# token-types: re-checked by hand 2026-10-22 (rfc-editor.org/errata/rfc6749). §1.5: 8722 Reported Technical (editorial: "Figure 1 above"; no claim changes). §1.4, §5.1: 4679, 6614 Reported (charset, editorial). None Verified on §1.1, §1.4, §1.5, §5.1.
sections:
  - key: "roles"
    section: "1.1"
    anchor: "section-1.1"
    title: "Roles"
  - key: "clientType"
    section: "2.1"
    anchor: "section-2.1"
    title: "Client Types"
  - key: "authReq"
    section: "4.1.1"
    anchor: "section-4.1.1"
    title: "Authorization Request"
    quote: "state RECOMMENDED. An opaque value used by the client to maintain state between the request and callback."
  - key: "authResp"
    section: "4.1.2"
    anchor: "section-4.1.2"
    title: "Authorization Response"
    quote: "The authorization code MUST expire shortly after it is issued to mitigate the risk of leaks. A maximum authorization code lifetime of 10 minutes is RECOMMENDED. The client MUST NOT use the authorization code more than once."
  - key: "authErr"
    section: "4.1.2.1"
    anchor: "section-4.1.2.1"
    title: "Error Response"
    quote: "If the request fails due to a missing, invalid, or mismatching redirection URI, or if the client identifier is missing or invalid, the authorization server SHOULD inform the resource owner of the error and MUST NOT automatically redirect the user-agent to the invalid redirection URI."
  - key: "tokenReq"
    section: "4.1.3"
    anchor: "section-4.1.3"
    title: "Access Token Request"
    quote: "redirect_uri REQUIRED, if the \"redirect_uri\" parameter was included in the authorization request as described in Section 4.1.1, and their values MUST be identical."
  - key: "tokenErr"
    section: "5.2"
    anchor: "section-5.2"
    title: "Error Response (token endpoint)"
  - key: "invGrant"
    section: "5.2"
    anchor: "section-5.2"
    title: "Error Response: invalid_grant"
    quote: "The provided authorization grant (e.g., authorization code, resource owner credentials) or refresh token is invalid, expired, revoked, does not match the redirection URI used in the authorization request, or was issued to another client."
  - key: "csrf"
    section: "10.12"
    anchor: "section-10.12"
    title: "Cross-Site Request Forgery"
  - key: "refresh"
    section: "1.5"
    anchor: "section-1.5"
    title: "Refresh Token"
  - key: "cc"
    section: "4.4"
    anchor: "section-4.4"
    title: "Client Credentials Grant"
  - key: "ccOnly"
    section: "4.4"
    anchor: "section-4.4"
    title: "Client Credentials Grant"
    quote: "The client credentials grant type MUST only be used by confidential clients."
  - key: "ccResp"
    section: "4.4.3"
    anchor: "section-4.4.3"
    title: "Client Credentials: Access Token Response"
    quote: "A refresh token SHOULD NOT be included."
  - key: "clientPwd"
    section: "2.3.1"
    anchor: "section-2.3.1"
    title: "Client Password"
    quote: "Clients in possession of a client password MAY use the HTTP Basic authentication scheme as defined in [RFC2617] to authenticate with the authorization server."
  - key: "rfc6749_2_3"
    section: "2.3"
    anchor: "section-2.3"
    title: "Client Authentication"
  - key: "invClient"
    section: "5.2"
    anchor: "section-5.2"
    title: "Error Response: invalid_client"
    quote: "If the client attempted to authenticate via the \"Authorization\" request header field, the authorization server MUST respond with an HTTP 401 (Unauthorized) status code and include the \"WWW-Authenticate\" response header field matching the authentication scheme used by the client."
  - key: "implicit"
    section: "1.3.2"
    anchor: "section-1.3.2"
    title: "Implicit"
    quote: "The implicit grant is a simplified authorization code flow optimized for clients implemented in a browser using a scripting language such as JavaScript."
  - key: "rfc6749_5_1"
    section: "5.1"
    anchor: "section-5.1"
    title: "Successful Response"
