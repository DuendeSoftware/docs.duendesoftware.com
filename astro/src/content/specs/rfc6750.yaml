id: "rfc6750"
title: "RFC 6750"
url: "https://www.rfc-editor.org/rfc/rfc6750"
status: "RFC"
# errata list re-checked by hand 2026-10-22 for access-token-validation (rfc-editor.org/errata/rfc6750): 5335 Reported (§2.1 b64token naming), 9053 and 9054 Reported (§5.1), 6161 Reported Editorial (§4). None on §3 or §3.1.
sections:
  - key: "bearer"
    section: "2.1"
    anchor: "section-2.1"
    title: "Authorization Request Header Field"
  - key: "bearerUsage"
    section: "1.2"
    anchor: "section-1.2"
    title: "Terminology"
  - key: "bearerErr"
    section: "3.1"
    anchor: "section-3.1"
    title: "Bearer Error Codes: invalid_token"
    quote: "The access token provided is expired, revoked, malformed, or invalid for other reasons. The resource SHOULD respond with the HTTP 401 (Unauthorized) status code."
  - key: "bearerHdr"
    section: "3"
    anchor: "section-3"
    title: "The WWW-Authenticate Response Header Field"
    quote: "If the protected resource request does not include authentication credentials or does not contain an access token that enables access to the protected resource, the resource server MUST include the HTTP \"WWW-Authenticate\" response header field; it MAY include it in response to other conditions as well."
  - key: "scopeErr"
    section: "3.1"
    anchor: "section-3.1"
    title: "Bearer Error Codes: insufficient_scope"
    quote: "The request requires higher privileges than provided by the access token. The resource server SHOULD respond with the HTTP 403 (Forbidden) status code and MAY include the \"scope\" attribute with the scope necessary to access the protected resource."
